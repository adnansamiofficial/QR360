<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 560" role="img" aria-labelledby="title desc">
  <title id="title">QR360 — Scan, Share, Connect</title>
  <desc id="desc">A green themed QR360 identity illustration with a QR inspired orbital mark.</desc>
  <defs>
    <radialGradient id="bgGlow"><stop stop-color="#1e5b40" stop-opacity=".72"/><stop offset="1" stop-color="#08110f" stop-opacity="0"/></radialGradient>
    <linearGradient id="orbit" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#baf7dc"/><stop offset=".5" stop-color="#3be0a0"/><stop offset="1" stop-color="#16865e"/></linearGradient>
    <linearGradient id="word" x1="0" y1="0" x2="1" y2="0"><stop stop-color="#baf7dc"/><stop offset=".48" stop-color="#3be0a0"/><stop offset="1" stop-color="#78edba"/></linearGradient>
    <filter id="glow"><feGaussianBlur stdDeviation="14" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
  </defs>
  <rect width="860" height="560" rx="28" fill="#08110f"/>
  <ellipse cx="430" cy="235" rx="390" ry="310" fill="url(#bgGlow)"/>
  <g opacity=".18" stroke="#3be0a0" fill="none"><circle cx="430" cy="225" r="170"/><circle cx="430" cy="225" r="210"/><circle cx="430" cy="225" r="250"/></g>
  <g transform="translate(327 78)" filter="url(#glow)">
    <rect x="0" y="0" width="206" height="206" rx="56" fill="#10251c" stroke="#315b46" stroke-width="3"/>
    <path d="M155 48a72 72 0 1 0 19 100" fill="none" stroke="url(#orbit)" stroke-width="17" stroke-linecap="round"/>
    <path d="M158 146c20 7 37 2 54-12" fill="none" stroke="#baf7dc" stroke-width="7" stroke-linecap="round"/>
    <g fill="#e4fff0">
      <rect x="40" y="39" width="44" height="44" rx="7"/><rect x="51" y="50" width="22" height="22" rx="3" fill="#10251c"/>
      <rect x="122" y="39" width="44" height="44" rx="7"/><rect x="133" y="50" width="22" height="22" rx="3" fill="#10251c"/>
      <rect x="40" y="122" width="44" height="44" rx="7"/><rect x="51" y="133" width="22" height="22" rx="3" fill="#10251c"/>
      <rect x="94" y="94" width="14" height="14" rx="3"/><rect x="121" y="98" width="14" height="14" rx="3"/><rect x="94" y="121" width="14" height="14" rx="3"/><rect x="121" y="128" width="14" height="14" rx="3"/>
    </g>
  </g>
  <text x="430" y="390" text-anchor="middle" fill="#effbf5" font-family="Inter,Arial,sans-serif" font-size="91" font-weight="850" letter-spacing="-5">QR<tspan fill="url(#word)">360</tspan></text>
  <path d="M212 425H648" stroke="#315b46" stroke-width="1.5"/>
  <circle cx="255" cy="462" r="4" fill="#3be0a0"/><circle cx="605" cy="462" r="4" fill="#3be0a0"/>
  <text x="430" y="469" text-anchor="middle" fill="#baf7dc" font-family="Inter,Arial,sans-serif" font-size="17" font-weight="700" letter-spacing="7">SCAN  •  SHARE  •  CONNECT</text>
</svg>
